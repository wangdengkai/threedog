[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threedog"
version = "0.2.0"
description = "风格驱动的本地文件整理 MCP server（style-driven local file organizer MCP server）"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "wangdengkai", email = "mrwangdengkai@163.com" }]
dependencies = [
    "fastmcp>=3.2.4,<4",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.scripts]
threedog = "threedog.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/threedog"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["miaomiao", "example", "tmp", "doc", "main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
